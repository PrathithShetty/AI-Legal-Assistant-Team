# Automates pull requests: assigns the author, copies labels from the linked issue,
# and fails if the PR is not linked to a backlog issue with "Closes #<number>".
name: PR Automation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  link-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Assign author, check linked issue, copy labels
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            if (!pr.assignees.length) {
              await github.rest.issues.addAssignees({ owner, repo, issue_number: pr.number, assignees: [pr.user.login] });
            }

            const match = (pr.body || '').match(/(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!match) {
              core.setFailed('Link the backlog issue in the PR description, e.g. "Closes #12".');
              return;
            }

            const issue = await github.rest.issues.get({ owner, repo, issue_number: Number(match[3]) });
            const labels = issue.data.labels.map(l => l.name);
            if (labels.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels });
            }
            core.info(`PR #${pr.number} linked to #${match[3]}: ${issue.data.title}`);
