# Automates pull requests: assigns the author, copies labels from the linked issue,
# and fails if the PR is not linked to a backlog issue with "Closes #<number>".
name: PR Automation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  link-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Assign author, check linked issue, copy labels
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            if (!pr.assignees.length) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: pr.number,
                assignees: [pr.user.login]
              });
            }

            const body = pr.body || '';
            const matches = [
              ...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)
            ];

            if (!matches.length) {
            core.warning(
            'No closing issue reference found. Add "Closes #<number>" to link a backlog issue.'
            );
            return;
            }

            const issueNumbers = [...new Set(matches.map(m => Number(m[1])))];

            for (const issueNumber of issueNumbers) {
              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              const labels = issue.data.labels.map(label => label.name);

              if (labels.length) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels
                });
              }

              core.info(
                `PR #${pr.number} linked to #${issueNumber}: ${issue.data.title}`
              );
            }
